#http
services:
  app:
    image: ghcr.io/mahn-ke/editor-photos-by-vincent:latest
    restart: unless-stopped
    mem_limit: 3g
    ports:
      - "3024:3000"
    environment:
      - APP_BASE_URL=https://editor.photos.by.vincent.mahn.ke
      # Sign-in runs through Immich's OAuth (Keycloak client "photos" in mahn-ke/repos);
      # no API key or client secret is needed here
      - IMMICH_BASE_URL=https://photos.by.vincent.mahn.ke
      - DATA_DIR=/app/data
      # ML models (≈330 MB) and the mask/RAW caches can be re-created, so they live in an
      # anonymous volume: kept across redeploys, but not picked up by the backup workflow
      # (it only backs up named volumes). /app/data (sessions, encrypted API keys, learner
      # state, suggestions) stays backed up.
      - CACHE_DIR=/app/cache
      - MODEL_DIR=/app/cache/models
    volumes:
      - data:/app/data
      - /app/cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  data:
