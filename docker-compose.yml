#http
version: "3.8"

services:
  app:
    image: ghcr.io/mahn-ke/editor-photos-by-vincent:latest
    restart: on-failure:5
    environment:
      - PORT=3024
    ports:
      - "3024:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3024/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
